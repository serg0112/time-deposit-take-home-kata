services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_DB: kata
      POSTGRES_USER: kata
      POSTGRES_PASSWORD: kata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - deposits:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kata -d kata"]
      interval: 2s
      timeout: 3s
      retries: 30
  swagger:
    image: swaggerapi/swagger-ui:v5.34.1
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro
volumes:
  deposits:
